appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: connect-screen
    timeout: 60000
- tapOn:
    id: connect-api-url
# NOTE: The input is prefilled with the last used URL
- eraseText: 100
- inputText: ${API_URL || 'https://ai.ronas.cloud'}
- hideKeyboard
- tapOn:
    id: connect-continue
# NOTE: The sign-in screen opens once the server check passes
- extendedWaitUntil:
    visible:
      id: sign-in-screen
    timeout: 30000
- tapOn:
    id: sign-in-email
- inputText:
    text: ${EMAIL}
    label: Enter email
- tapOn:
    id: sign-in-password
- inputText:
    text: ${PASSWORD}
    label: Enter password
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: sign-in-submit
      enabled: true
    timeout: 30000
- tapOn:
    id: sign-in-submit
